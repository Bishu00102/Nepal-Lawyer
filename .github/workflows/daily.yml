name: Daily court update

on:
  schedule:
    # Nepal time = UTC+5:45. 18:40, 22:40 and 07:40 NPT: after hearings, late results, next day's list.
    - cron: "55 12 * * *"
    - cron: "55 16 * * *"
    - cron: "55 1 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back to re-scrape cause lists"
        default: "8"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: court-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Install Nepali OCR
        run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr tesseract-ocr-nep poppler-utils
      - name: Cause lists and results (Supreme Court, High Courts, Special Court)
        run: python scraper/sc_daily.py --days "${{ github.event.inputs.days || '8' }}"
      - name: District courts — authenticated judgments this week
        run: python scraper/district.py
      - name: Supreme Court published judgments / orders (new ones only, OCR)
        run: python scraper/sc_publications.py --workers 4
      - name: Nepal Kanoon Patrika — new decisions
        run: python scraper/nkp.py --refresh-latest 300
      - name: Cross-references (precedents <-> provisions)
        run: python scraper/links.py
      - name: AI server (Cloudflare Worker) — deploy when the secrets are set
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        working-directory: worker
        run: |
          npm ci --no-audit --no-fund
          # find or create the storage namespace and put its id into wrangler.toml
          ID=$(npx wrangler kv namespace list | python3 -c "import json,sys; print(next((n['id'] for n in json.load(sys.stdin) if n['title'].endswith('STORE')), ''))")
          if [ -z "$ID" ]; then
            npx wrangler kv namespace create STORE
            ID=$(npx wrangler kv namespace list | python3 -c "import json,sys; print(next((n['id'] for n in json.load(sys.stdin) if n['title'].endswith('STORE')), ''))")
          fi
          sed -i "s/KV_NAMESPACE_ID/$ID/" wrangler.toml
          OWNER=$(echo "${{ github.repository_owner }}" | tr 'A-Z' 'a-z')
          sed -i "s#https://bishu00102.github.io#https://$OWNER.github.io#" wrangler.toml
          npx wrangler deploy | tee deploy.log
          [ -n "$ANTHROPIC_API_KEY" ] && printf '%s' "$ANTHROPIC_API_KEY" | npx wrangler secret put ANTHROPIC_API_KEY
          [ -n "$ADMIN_PASSWORD" ] && printf '%s' "$ADMIN_PASSWORD" | npx wrangler secret put ADMIN_PASSWORD
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "AI_PROXY_URL=$URL" >> "$GITHUB_ENV"
          echo "AI server: $URL"
      - name: Build website data
        run: python scraper/build_site.py
      - name: Commit data
        run: |
          git config user.name "court-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Data update $(date -u +%F)"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
